spring:
  application:
    name: wedding-api
  flyway:
    enabled: false
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        max-age: 7d
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

app:
  guest-access:
    max-attempts: 10
    challenge-after-failures: 3
    attempt-window: 15m
    session-timeout: 30m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175}
