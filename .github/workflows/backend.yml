name: Backend CI and homolog deploy

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify with PostgreSQL Testcontainers
        run: ./mvnw --batch-mode --no-transfer-progress verify -Dspring.flyway.enabled=false -Dspring.jpa.hibernate.ddl-auto=validate
      - name: Package Lambda ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/lambda
          cp target/wedding-api-0.0.1-SNAPSHOT.jar target/lambda/app.jar
          cp scripts/run.sh target/lambda/run.sh
          chmod 755 target/lambda/run.sh
          cd target/lambda
          zip ../wedding-api.zip app.jar run.sh
          cd ..
          sha256sum wedding-api.zip > wedding-api.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wedding-api-${{ github.sha }}
          path: |
            target/wedding-api.zip
            target/wedding-api.zip.sha256
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: homolog
    concurrency:
      group: lambda-homolog
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      LAMBDA_FUNCTION: ${{ vars.LAMBDA_FUNCTION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wedding-api-${{ github.sha }}
          path: artifact
      - name: Validate configuration and package
        shell: bash
        run: |
          : "${AWS_REGION:?Configure AWS_REGION in environment homolog}"
          : "${LAMBDA_FUNCTION:?Configure LAMBDA_FUNCTION in environment homolog}"
          : "${ARTIFACT_BUCKET:?Configure ARTIFACT_BUCKET in environment homolog}"
          : "${AWS_ROLE_ARN:?Configure AWS_ROLE_ARN in environment homolog}"
          cd artifact
          sha256sum --check wedding-api.zip.sha256
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
      - name: Publish and verify homolog
        run: bash scripts/deploy-homolog.sh

